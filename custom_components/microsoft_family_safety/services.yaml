set_screentime_limit:
  name: Set Screen Time Limit
  description: Set the daily screen time allowance for a specific day of the week.
  fields:
    platform:
      name: Platform
      description: Target schedule. Omitted values preserve Windows behavior.
      default: Windows
      selector:
        select:
          options:
            - Windows
            - Xbox
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety
    day_of_week:
      name: Day of Week
      description: "Day of week: 0=Sunday, 1=Monday, 2=Tuesday, 3=Wednesday, 4=Thursday, 5=Friday, 6=Saturday."
      required: true
      selector:
        number:
          min: 0
          max: 6
          step: 1
    hours:
      name: Hours
      description: Allowed hours of screen time (0-24).
      required: true
      selector:
        number:
          min: 0
          max: 24
          step: 1
          unit_of_measurement: hours
    minutes:
      name: Minutes
      description: Additional minutes of screen time (0-59).
      default: 0
      selector:
        number:
          min: 0
          max: 59
          step: 15
          unit_of_measurement: minutes

