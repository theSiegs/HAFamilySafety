block_app:
  name: Block Application
  description: Block an application for a child account.
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety
    app_id:
      name: Application ID
      description: The application ID to block (e.g., "appx:Microsoft.WindowsStore").
      required: true
      selector:
        text:

unblock_app:
  name: Unblock Application
  description: Unblock an application for a child account.
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety
    app_id:
      name: Application ID
      description: The application ID to unblock.
      required: true
      selector:
        text:

lock_platform:
  name: Lock Platform
  description: "Lock a platform (Windows/Xbox/Mobile) for a child account until a time. The first lock saves the lock or extra time Microsoft had in force so unlock_platform can put a lock back; a lock already in force that ends later is kept. Answers with the saved prior state and the lock applied. Xbox needs the Xbox Family Settings sign-in linked."
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety
    platform:
      name: Platform
      description: The platform to lock.
      required: true
      selector:
        select:
          options:
            - "Windows"
            - "Xbox"
            - "Mobile"
    duration_hours:
      name: Duration (hours)
      description: Duration of the lock in hours (default 24). Give this or until, not both.
      selector:
        number:
          min: 1
          max: 168
          step: 1
          unit_of_measurement: hours
    until:
      name: Until
      description: When the lock ends, instead of duration_hours. A time without an offset is Home Assistant's local time. At most 168 hours away.
      selector:
        datetime:

unlock_platform:
  name: Unlock Platform
  description: "Unlock a platform (Windows/Xbox/Mobile) for a child account. Puts back a lock that was in force before lock_platform if it has not run out yet, otherwise cancels the lock. A lock or extra time set in the Family Safety app since is left alone. Answers with the prior state and what was applied."
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety
    platform:
      name: Platform
      description: The platform to unlock.
      required: true
      selector:
        select:
          options:
            - "Windows"
            - "Xbox"
            - "Mobile"

add_time_bonus:
  name: Add Extra Time
  description: "Give a child extra time on the Xbox or on Windows, for some minutes or until a time. The Xbox goes through the Xbox Family Settings service (needs its sign-in linked), Windows through the Family Safety mobile API. Refused while the platform is locked, unless Replace lock is on. Fails when Microsoft does not confirm the extra time, or when the platform stays locked. Can answer with added, until and replaced_lock."
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety
    platform:
      name: Platform
      description: Xbox (the default) or Windows.
      default: "Xbox"
      selector:
        select:
          options:
            - "Xbox"
            - "Windows"
    minutes:
      name: Minutes
      description: Extra time from now, 1 to 1440 minutes. Give this or until.
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: minutes
    until:
      name: Until
      description: When the extra time ends, instead of minutes (at most 24 hours from now).
      selector:
        datetime:
    replace_lock:
      name: Replace lock
      description: "Microsoft keeps one override per platform, so extra time replaces a lock. Off (default): refused while the platform is locked, by this integration or by a parent. On: the lock is replaced by the extra time."
      default: false
      selector:
        boolean:

probe_windows_extra_time:
  name: Probe Windows Extra Time
  description: "Diagnostic (administrators only): for one child with nothing in force on Windows, writes a short AllowUntil override on the mobile API, reads it back, cancels it and reads again. Returns every request with Microsoft's raw status and body."
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account.
      required: true
      selector:
        text:
    confirm_risk:
      name: Confirm risk
      description: Must be on. The child gets a few minutes of extra time on Windows until the cancel.
      required: true
      selector:
        boolean:
    minutes:
      name: Minutes
      description: Length of the test extra time (1 to 10, default 2).
      default: 2
      selector:
        number:
          min: 1
          max: 10
          unit_of_measurement: minutes

probe_xbox_schedule:
  name: Probe Xbox Schedule
  description: "Diagnostic (administrators only): returns the raw Xbox Family Settings schedule of one child (GET only)."
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account.
      required: true
      selector:
        text:

probe_app_policy:
  name: Probe App Policy
  description: "Diagnostic (administrators only): reads one app's limit policy every way the mobile API might answer it (policy, list, settings and activity report reads; no writes) and returns each request with Microsoft's raw status and body."
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account.
      required: true
      selector:
        text:
    app_id:
      name: App ID
      description: "The app's ID as the Applications sensor lists it, e.g. appx:windowsplt:example_1234abcd or x:1234567890."
      required: true
      selector:
        text:

cancel_time_bonus:
  name: Cancel Extra Time
  description: "Cancel the extra time in force on a child's Xbox or Windows. Only extra time is cancelled: fails while the platform is locked (a lock is never lifted), and does nothing when no extra time is in force. Can answer with cancelled and reason or lock_in_force."
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety
    platform:
      name: Platform
      description: Xbox (the default) or Windows.
      default: "Xbox"
      selector:
        select:
          options:
            - "Xbox"
            - "Windows"

approve_request:
  name: Approve Pending Request
  description: Approve a pending screen time extension request.
  fields:
    request_id:
      name: Request ID
      description: The ID of the pending request to approve.
      required: true
      selector:
        text:
    extension_minutes:
      name: Extension (minutes)
      description: Time extension to grant in minutes (default 60).
      default: 60
      selector:
        number:
          min: 15
          max: 480
          step: 15
          unit_of_measurement: minutes

deny_request:
  name: Deny Pending Request
  description: Deny a pending screen time extension request.
  fields:
    request_id:
      name: Request ID
      description: The ID of the pending request to deny.
      required: true
      selector:
        text:

set_screentime_limit:
  name: Set Screen Time Limit
  description: Set the daily screen time allowance for a specific day of the week, for Windows or for the Xbox.
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety
    day_of_week:
      name: Day of Week
      description: "Day of week: 0=Sunday, 1=Monday, 2=Tuesday, 3=Wednesday, 4=Thursday, 5=Friday, 6=Saturday. Required unless today_only is set."
      selector:
        number:
          min: 0
          max: 6
          step: 1
    hours:
      name: Hours
      description: Allowed hours of screen time (0-24).
      required: true
      selector:
        number:
          min: 0
          max: 24
          step: 1
          unit_of_measurement: hours
    minutes:
      name: Minutes
      description: Additional minutes of screen time (0-59).
      default: 0
      selector:
        number:
          min: 0
          max: 59
          step: 15
          unit_of_measurement: minutes
    platform:
      name: Platform
      description: "Windows (default) or Xbox. Xbox writes the limit the console enforces, through the Xbox Family Settings service: Xbox must be among the monitored platforms with the Xbox Family Settings sign-in linked."
      default: "Windows"
      selector:
        select:
          options:
            - "Windows"
            - "Xbox"
    today_only:
      name: Today only
      description: Change today only. The previous value is put back at local midnight, unless it was changed again in the meantime. day_of_week can be left out.
      default: false
      selector:
        boolean:

set_screentime_intervals:
  name: Set Screen Time Intervals
  description: Set the allowed time window for screen time on a specific day, for Windows or for the Xbox (the Xbox allowed hours).
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety
    day_of_week:
      name: Day of Week
      description: "Day of week: 0=Sunday, 1=Monday, 2=Tuesday, 3=Wednesday, 4=Thursday, 5=Friday, 6=Saturday. Required unless today_only is set."
      selector:
        number:
          min: 0
          max: 6
          step: 1
    start_hour:
      name: Start Hour
      description: Start of allowed window (0-23).
      required: true
      selector:
        number:
          min: 0
          max: 23
          step: 1
    start_minute:
      name: Start Minute
      description: Start minute (0 or 30).
      default: 0
      selector:
        number:
          min: 0
          max: 30
          step: 30
    end_hour:
      name: End Hour
      description: End of allowed window (0-24, 24 = midnight).
      required: true
      selector:
        number:
          min: 0
          max: 24
          step: 1
    end_minute:
      name: End Minute
      description: End minute (0 or 30).
      default: 0
      selector:
        number:
          min: 0
          max: 30
          step: 30
    platform:
      name: Platform
      description: "Windows (default) or Xbox. Xbox sets the allowed hours the console enforces, through the Xbox Family Settings service, and keeps the day's limit: Xbox must be among the monitored platforms with the Xbox Family Settings sign-in linked."
      default: "Windows"
      selector:
        select:
          options:
            - "Windows"
            - "Xbox"
    today_only:
      name: Today only
      description: Change today only. The previous value is put back at local midnight, unless it was changed again in the meantime. day_of_week can be left out.
      default: false
      selector:
        boolean:

set_app_time_limit:
  name: Set App Time Limit
  description: Set a daily time limit for a specific application.
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety
    app_id:
      name: Application ID
      description: The application ID (e.g., "x:windowsplt:61f08e27aff06317").
      required: true
      selector:
        text:
    app_name:
      name: Application Name
      description: The display name of the application.
      required: true
      selector:
        text:
    platform:
      name: Platform
      description: The platform (windows, xbox, or mobile).
      default: "windows"
      selector:
        select:
          options:
            - "windows"
            - "xbox"
            - "mobile"
    hours:
      name: Hours
      description: Allowed hours per day (0-24).
      required: true
      selector:
        number:
          min: 0
          max: 24
          step: 1
          unit_of_measurement: hours
    minutes:
      name: Minutes
      description: Additional minutes per day (0-59).
      default: 0
      selector:
        number:
          min: 0
          max: 59
          step: 15
          unit_of_measurement: minutes
    start_time:
      name: Start Time
      description: "Start of allowed window (format: HH:MM:SS, default 07:00:00)."
      default: "07:00:00"
      selector:
        text:
    end_time:
      name: End Time
      description: "End of allowed window (format: HH:MM:SS, default 22:00:00)."
      default: "22:00:00"
      selector:
        text:

remove_app_time_limit:
  name: Remove App Time Limit
  description: Remove the time limit for a specific application.
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety
    app_id:
      name: Application ID
      description: The application ID.
      required: true
      selector:
        text:
    app_name:
      name: Application Name
      description: The display name of the application.
      required: true
      selector:
        text:
    platform:
      name: Platform
      description: The platform (windows, xbox, or mobile).
      default: "windows"
      selector:
        select:
          options:
            - "windows"
            - "xbox"
            - "mobile"

block_website:
  name: Block Website
  description: Block a website for a child account.
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety
    website:
      name: Website
      description: 'The domain to block (e.g., "example.com"), or a list of domains. Every site is tried; when one fails, the call fails naming the sites done and the sites failed. Asked for a response, it answers the sites done.'
      required: true
      selector:
        text:
          multiple: true

allow_website:
  name: Allow Website
  description: Add a website to the allowed list of a child account.
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety
    website:
      name: Website
      description: 'The domain to allow (e.g., "example.com"), or a list of domains. Every site is tried; when one fails, the call fails naming the sites done and the sites failed. Asked for a response, it answers the sites done.'
      required: true
      selector:
        text:
          multiple: true

remove_website:
  name: Remove Website
  description: Remove a website from blocked/allowed list.
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety
    website:
      name: Website
      description: The domain to remove, or a list of domains. Every site is tried; when one fails, the call fails naming the sites done and the sites failed. Asked for a response, it answers the sites done.
      required: true
      selector:
        text:
          multiple: true

toggle_web_filter:
  name: Toggle Web Filter
  description: Enable or disable web filtering for a child account.
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety
    enabled:
      name: Enabled
      description: True to enable web filtering, false to disable.
      required: true
      selector:
        boolean:

set_age_rating:
  name: Set Age Rating
  description: Set the content age rating restriction for a child account.
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety
    age:
      name: Age Rating
      description: "Age limit (3-20, or 21 for no restriction)."
      required: true
      selector:
        number:
          min: 3
          max: 21
          step: 1

set_acquisition_policy:
  name: Set Ask-to-Buy Policy
  description: Enable or disable ask-to-buy (purchase approval) for a child account.
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety
    require_approval:
      name: Require Approval
      description: True = require approval for purchases, false = unrestricted.
      required: true
      selector:
        boolean:

lock_account:
  name: Lock Account
  description: Lock a child account by setting all screen time to zero (all 7 days, all intervals). Saves current policy for later restoration.
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety

unlock_account:
  name: Unlock Account
  description: Unlock a child account by restoring the screen time policy saved when it was locked. Refuses when no saved policy exists, so a real schedule is never replaced by a default one.
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety

request_reauth:
  name: Request Reauthentication
  description: Start the Microsoft sign-in flow now, for example from a dashboard button, instead of waiting for the integration to detect an expired session.

get_sites:
  name: Get Sites
  description: "Return the child's blocked and allowed websites exactly as Microsoft stores them (absolute URLs), whether the web filter is on, and which blocked domains sync_site_list added (from_list, and per list in from_list_by_url). Administrators only."
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety

pause_app:
  name: Pause App
  description: "Block Windows or Xbox apps of a child for now. Each app's policy (its daily time limit, or none) is read from Microsoft and saved before its first pause, and kept while it is blocked; resume_app puts it back. Apps already blocked, or whose policy cannot be read, are not paused. A repeat pause keeps the first saved state, also after a restart; an app whose limit a parent changed since is left as it is. Answers with the apps paused, changed by a parent, skipped and failed; fails when every app failed."
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account.
      required: true
      selector:
        text:
    apps:
      name: Apps
      description: "App IDs as the Applications sensor lists them (x:... for Xbox, appx:... or win32:... for Windows)."
      required: true
      selector:
        text:
          multiple: true

resume_app:
  name: Resume App
  description: "Unblock apps pause_app blocked, putting back the time limit each had before (or none), and forget their saved state. Without apps, every paused app of the child. An app someone unblocked or changed in the meantime is left as it is. Answers with the apps resumed, released, changed by a parent, skipped and failed; fails when every app failed."
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account.
      required: true
      selector:
        text:
    apps:
      name: Apps
      description: App IDs to resume; leave empty for every paused app of the child.
      required: false
      selector:
        text:
          multiple: true

restore_today_only:
  name: Restore Today-Only Changes
  description: Put back now the values replaced by today-only screen time changes, instead of at midnight. Values changed again in the meantime are kept.
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account.
      required: true
      selector:
        text:
    platform:
      name: Platform
      description: Only this schedule. Omitted = every platform.
      selector:
        select:
          options:
            - Windows
            - Xbox

sync_site_list:
  name: Sync Site List
  description: "Keep the child's blocked websites in step with a published list of domains (one per line, '#' comments). Adds what the list gained and removes only what this same list added before and has since dropped; sites blocked by hand and allowed sites are left alone, and a domain sharing a site with an allowed one is skipped. The list must be served over https (redirects are not followed), is read up to 1 MiB, and only plain domains are taken. An empty or failed download, or one that would remove most of what the list added, changes nothing; stop removes everything the list added. Answers with what was added, removed, kept and skipped. Administrators only."
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety
    url:
      name: List URL
      description: "https:// address of the list, for example a raw file on GitHub."
      required: true
      selector:
        text:
          type: url
    max_domains:
      name: Maximum domains
      description: Refuse a list with more domains than this (default 2000).
      default: 2000
      selector:
        number:
          min: 1
          max: 2000
          mode: box
    stop:
      name: Stop
      description: Remove every site this list added for the child and forget the list.
      default: false
      selector:
        boolean:
