lock_account:
  name: Lock Account
  description: "Lock a child account by setting all screen time to zero (all 7 days, all intervals). Saves current policy for later restoration. The lock never expires on its own: it stays until unlock_account (or the screen time limits switch) restores the saved policy."
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account to lock. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety

unlock_account:
  name: Unlock Account
  description: Unlock a child account by restoring the screen time policy saved when it was locked. Refuses when no saved policy exists, so a real schedule is never replaced by a default one.
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account to unlock. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety

request_reauth:
  name: Request Reauthentication
  description: Start the Microsoft sign-in flow now, for example from a dashboard button, instead of waiting for the integration to detect an expired session.

sync_site_list:
  name: Sync Site List
  description: "Keep the child's blocked websites in step with a published list of domains (one per line, '#' comments). Adds what the list gained and removes only what this same list added before and has since dropped; sites blocked by hand and allowed sites are left alone, and a domain sharing a site with an allowed one is skipped. The list must be served over https (redirects are not followed), is read up to 1 MiB, and only plain domains are taken. An empty or failed download, or one that would remove most of what the list added, changes nothing; stop removes everything the list added. Answers with what was added, removed, kept and skipped. Administrators only."
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety
    url:
      name: List URL
      description: "https:// address of the list, for example a raw file on GitHub."
      required: true
      selector:
        text:
          type: url
    max_domains:
      name: Maximum domains
      description: Refuse a list with more domains than this (default 2000).
      default: 2000
      selector:
        number:
          min: 1
          max: 2000
          mode: box
    stop:
      name: Stop
      description: Remove every site this list added for the child and forget the list.
      default: false
      selector:
        boolean:

pause_app:
  name: Pause App
  description: "Block Windows or Xbox apps of a child for now, saving whether each was blocked before its first pause; resume_app puts that back. A repeat pause keeps the first saved state, also after a restart. An app already blocked is skipped and left alone. Answers with the apps paused and skipped."
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety
    apps:
      name: Apps
      description: "App ids as the app switches and the apps attribute show them (x:... for Xbox, appx:... or win32:... for Windows). packages is accepted too."
      required: true
      selector:
        text:
          multiple: true

resume_app:
  name: Resume App
  description: "Unblock the apps pause_app blocked and forget their saved state. Without apps, every paused app of the child. Answers with the apps resumed and skipped."
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety
    apps:
      name: Apps
      description: App ids to resume; leave empty for every paused app of the child.
      required: false
      selector:
        text:
          multiple: true

get_sites:
  name: Get Sites
  description: "The child's blocked and allowed websites exactly as Microsoft stores them (absolute URLs), whether the web filter is on, and which blocked domains sync_site_list added (from_list, and per list in from_list_by_url). Administrators only."
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety

add_time_bonus:
  name: Add Time Bonus (experimental)
  description: "EXPERIMENTAL: based on an uncaptured request; verified by reading back. Give a child extra time on Windows or the Xbox, for some minutes or until a time. Microsoft keeps one override per platform, so this replaces a lock placed by lock_platform (released_hold in the answer). Succeeds only when Microsoft reads back extra time ending when asked; otherwise it fails and says what was read back. Answers with platform, applied_until, read_back and released_hold."
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety
    platform:
      name: Platform
      description: Windows or Xbox.
      required: true
      selector:
        select:
          options:
            - "Windows"
            - "Xbox"
    minutes:
      name: Minutes
      description: Extra time from now, 1 to 1440 minutes. Give this or until.
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
    until:
      name: Until
      description: When the extra time ends, instead of minutes (local time without an offset).
      selector:
        datetime:

cancel_time_bonus:
  name: Cancel Time Bonus (experimental)
  description: "EXPERIMENTAL: based on an uncaptured request; verified by reading back. Cancel extra time on Windows or the Xbox. Only extra time is cancelled: when a lock (ours or a parent's) or nothing is in force, nothing is sent and the answer says so."
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety
    platform:
      name: Platform
      description: Windows or Xbox.
      required: true
      selector:
        select:
          options:
            - "Windows"
            - "Xbox"

probe_xbox_token:
  name: Probe Xbox token (diagnostic)
  description: "Administrators only. Checks whether the stored Microsoft sign-in can also get an Xbox Live token, without changing anything the integration uses. Answers with HTTP status codes, error codes, the granted scope and expiry only; no token, gamertag or Xbox user id is returned or logged. Refuses unless confirm_risk is true: see the README."
  fields:
    entry_id:
      name: Config entry
      description: The Microsoft Family Safety entry to use. Optional with a single entry.
      required: false
      selector:
        config_entry:
          integration: microsoft_family_safety
    confirm_risk:
      name: Confirm the risk
      description: "Must be true. Using the stored sign-in for another scope is not documented by Microsoft for this sign-in type; in the worst case the integration would need a new sign-in."
      required: true
      default: false
      selector:
        boolean:

probe_xbox_mobile_overrides:
  name: Probe Xbox mobile overrides (diagnostic)
  description: "Administrators only. Reads each child's Family Safety device-limits override state over the mobile API (GET only, nothing is changed) and answers with non-secret facts: whether the child has an Xbox in device limits, whether it is blocked now, and the override types and counts. No tokens, Xbox user ids, gamertags or device ids are returned or logged."
  fields:
    entry_id:
      name: Config entry
      description: The Microsoft Family Safety entry to use. Optional with a single entry.
      required: false
      selector:
        config_entry:
          integration: microsoft_family_safety
    raw_shape:
      name: Report the raw shape (key names only)
      description: "When true, also report the key names present in each child's Xbox override entry (and its override/device entries), to confirm the shape. Names only: no values and no ids."
      required: false
      default: false
      selector:
        boolean:
    confirm_risk:
      name: Confirm the risk
      description: "Must be true. Reads live state from Microsoft for every child."
      required: true
      default: false
      selector:
        boolean:

test_xbox_mobile_override:
  name: Test Xbox mobile override (diagnostic)
  description: "Administrators only. Confirms the mobile Xbox override path live. With dry true it only reads and reports which children's Xbox has no active hold (pick one of those). Otherwise, for the given child whose Xbox has no active hold, it sets a short self-clearing block (~2-3 min), reads it back, then cancels it and reads back to confirm it is gone. It always clears what it set and never leaves the Xbox blocked; if the Xbox already has an active hold it aborts and changes nothing. Returns a non-secret trace."
  fields:
    entry_id:
      name: Config entry
      description: The Microsoft Family Safety entry to use. Optional with a single entry.
      required: false
      selector:
        config_entry:
          integration: microsoft_family_safety
    child:
      name: Child
      description: The child to test, by first name or account id. Required unless dry is true.
      required: false
      selector:
        text:
    dry:
      name: Dry run (read only)
      description: "When true, nothing is written: it only reports which children's Xbox is safe to test."
      required: false
      default: false
      selector:
        boolean:
    confirm_risk:
      name: Confirm the risk
      description: "Must be true. A non-dry run writes a short, self-clearing Xbox block to Microsoft."
      required: true
      default: false
      selector:
        boolean:
