lock_platform:
  name: Lock Platform
  description: "Lock a platform (Windows/Xbox/Mobile) for a child account until a time. The first lock saves the override Microsoft had in force (a parent's own lock, or none) so unlock_platform can put it back; a lock already in force that ends later is kept. Answers with the saved prior state, the lock applied and lock_path (web, or mobile_schedule: an Xbox lock placed through today's Xbox schedule while the web session is down, which ends at midnight at the latest). Keep strict mode off when another integration (Hearth, for example) manages these locks: strict mode would place a lock again after a parent released it in the Family Safety app, fighting the parent's decision."
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety
    platform:
      name: Platform
      description: The platform to lock.
      required: true
      selector:
        select:
          options:
            - "Windows"
            - "Xbox"
            - "Mobile"
    duration_hours:
      name: Duration (hours)
      description: Duration of the lock in hours (default 24). Give this or until, not both.
      selector:
        number:
          min: 1
          max: 168
          step: 1
          unit_of_measurement: hours
    until:
      name: Until
      description: When the lock ends, instead of duration_hours. A time without an offset is Home Assistant's local time.
      selector:
        datetime:

unlock_platform:
  name: Unlock Platform
  description: "Unlock a platform (Windows/Xbox/Mobile) for a child account. Puts back the lock that was in force before lock_platform if it has not run out yet, otherwise cancels the lock. An Xbox lock placed through today's Xbox schedule (lock_path mobile_schedule) puts the saved day back, unless a parent changed it in the app since (left_parent_override). Answers with the prior state, what was applied and lock_path. Keep strict mode off when another integration (Hearth, for example) manages these locks: strict mode would place a lock again after a parent released it in the Family Safety app, fighting the parent's decision."
  fields:
    account_id:
      name: Account ID
      description: The user ID of the child account. Give this or an entity of the child.
      required: false
      selector:
        text:
    entity_id:
      name: Child entity
      description: Any Microsoft Family Safety entity of the child (or of one of its devices), instead of the account ID.
      required: false
      selector:
        entity:
          integration: microsoft_family_safety
    platform:
      name: Platform
      description: The platform to unlock.
      required: true
      selector:
        select:
          options:
            - "Windows"
            - "Xbox"
            - "Mobile"

approve_request:
